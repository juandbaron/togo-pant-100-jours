name: Update project dashboard from Excel
on:
  push:
    branches: [main]
    paths: ['PACT_100_JOURS_MASTER.xlsx', 'sync_data.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate data.js from master Excel
        run: python3 sync_data.py
      - name: Commit data.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh project dashboard data"
            git push
          fi
